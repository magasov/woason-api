name: Deploy gialgiay

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-gialgiay]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart gialgiay on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GIALGIAY_DEPLOY_KEY: ${{ secrets.GIALGIAY_DEPLOY_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 45m
          envs: GIALGIAY_DEPLOY_KEY,DEEPSEEK_API_KEY
          script: |
            set -euo pipefail
            REPO_DIR=/opt/gialgiay
            KEY_FILE=/tmp/gialgiay-github
            printf '%s\n' "$GIALGIAY_DEPLOY_KEY" > "$KEY_FILE"
            chmod 600 "$KEY_FILE"
            export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

            if [ ! -d "$REPO_DIR/.git" ]; then
              mkdir -p "$REPO_DIR"
              git clone --branch main git@github.com:magasov/gialgiay-ai.git "$REPO_DIR"
            fi
            cd "$REPO_DIR"
            git fetch origin main
            git reset --hard origin/main
            rm -f "$KEY_FILE"
            echo "Repo SHA: $(git rev-parse --short HEAD)"
            echo "Prompt file: $(grep -c 'Платформ кхеллар' backend/src/ai/system-prompt.ts || true) matches"
            DEPLOY_DEEPSEEK_API_KEY="${DEEPSEEK_API_KEY:-}"

            CADDY_ID="$(docker ps --filter ancestor=caddy:2-alpine -q | head -n 1)"
            if [ -z "$CADDY_ID" ]; then
              CADDY_ID="$(docker ps --format '{{.ID}} {{.Names}}' | awk 'tolower($0) ~ /caddy/ {print $1; exit}')"
            fi
            if [ -z "$CADDY_ID" ]; then
              echo "WOAson Caddy container not found"
              exit 1
            fi
            FMT='{{range $k, $v := .NetworkSettings.Networks}}{{println $k}}{{end}}'
            PROXY_NETWORK="$(docker inspect -f "$FMT" "$CADDY_ID" | awk '$0 != "bridge" && $0 != "host" && $0 != "none" && NF { print; exit }')"
            if [ -z "$PROXY_NETWORK" ]; then
              echo "Could not find Caddy docker network"
              docker inspect "$CADDY_ID" --format '{{json .NetworkSettings.Networks}}'
              exit 1
            fi
            export PROXY_NETWORK
            echo "Using proxy network: $PROXY_NETWORK"

            if [ ! -f .env ]; then
              POSTGRES_PASSWORD="$(openssl rand -hex 16)"
              JWT_ACCESS_SECRET="$(openssl rand -hex 32)"
              JWT_REFRESH_SECRET="$(openssl rand -hex 32)"
              umask 077
              printf '%s\n' \
                "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" \
                "DATABASE_URL=postgresql://gialgiay:${POSTGRES_PASSWORD}@gialgiay-postgres:5432/gialgiay?schema=public" \
                "REDIS_URL=redis://gialgiay-redis:6379" \
                "JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}" \
                "JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}" \
                "JWT_ACCESS_EXPIRES=15m" \
                "JWT_REFRESH_EXPIRES=7d" \
                "PORT=4000" \
                "FRONTEND_URL=https://gialgiay.ru,https://www.gialgiay.ru" \
                "PUBLIC_API_URL=https://gialgiay.ru" \
                "DEEPSEEK_API_KEY=" \
                "DEEPSEEK_API_URL=https://api.deepseek.com/v1/chat/completions" \
                "DEEPSEEK_MODEL=deepseek-chat" \
                "SYSTEM_PROMPT=" \
                "ADMIN_EMAIL=77aushev@mail.ru" \
                "ADMIN_PASSWORD=" \
                "NEXT_PUBLIC_API_URL=https://gialgiay.ru/api" \
                > .env
              echo "Created ${REPO_DIR}/.env"
            fi

            set -a
            # shellcheck disable=SC1091
            . "${REPO_DIR}/.env"
            set +a
            if [ -z "${POSTGRES_PASSWORD:-}" ]; then
              echo "POSTGRES_PASSWORD missing in .env"
              exit 1
            fi

            grep -vE '^(DATABASE_URL|REDIS_URL|DEEPSEEK_API_KEY|DEEPSEEK_API_URL|DEEPSEEK_MODEL|SYSTEM_PROMPT)=' .env > .env.tmp || true
            printf 'DATABASE_URL=postgresql://gialgiay:%s@gialgiay-postgres:5432/gialgiay?schema=public\n' "$POSTGRES_PASSWORD" >> .env.tmp
            printf 'REDIS_URL=redis://gialgiay-redis:6379\n' >> .env.tmp
            printf 'DEEPSEEK_API_URL=https://api.deepseek.com/v1/chat/completions\n' >> .env.tmp
            printf 'DEEPSEEK_MODEL=deepseek-chat\n' >> .env.tmp
            printf 'SYSTEM_PROMPT=\n' >> .env.tmp
            if [ -z "${DEPLOY_DEEPSEEK_API_KEY:-}" ]; then
              echo "DEEPSEEK_API_KEY secret is empty — chat would ignore the system prompt"
              exit 1
            fi
            printf 'DEEPSEEK_API_KEY=%s\n' "$DEPLOY_DEEPSEEK_API_KEY" >> .env.tmp
            mv .env.tmp .env
            set -a
            # shellcheck disable=SC1091
            . "${REPO_DIR}/.env"
            set +a
            echo "DEEPSEEK_API_KEY in .env: ${#DEEPSEEK_API_KEY} chars"
            echo "SYSTEM_PROMPT in .env: ${#SYSTEM_PROMPT} chars (must be 0 so code prompt is used)"

            api_healthy=1
            if ! docker exec gialgiay-api node -e "require('http').get('http://127.0.0.1:4000/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" 2>/dev/null; then
              api_healthy=0
            fi
            if docker logs --tail 100 gialgiay-api 2>/dev/null | grep -Eq 'P1000|Authentication failed against database server'; then
              api_healthy=0
            fi

            if [ "$api_healthy" != "1" ]; then
              echo "API is down or Postgres auth is wrong — recreating database volume"
              docker rm -f gialgiay-api gialgiay-postgres || true
              docker volume rm gialgiay_gialgiay_pg || true
              rm -f "${REPO_DIR}/.db-ready"
            fi

            docker compose -f docker-compose.prod.yml --env-file "${REPO_DIR}/.env" build --no-cache api
            docker compose -f docker-compose.prod.yml --env-file "${REPO_DIR}/.env" up -d --build --force-recreate api web
            docker network connect "$PROXY_NETWORK" gialgiay-api || true
            docker network connect "$PROXY_NETWORK" gialgiay-web || true

            echo "Waiting for API health"
            ready=0
            for i in $(seq 1 60); do
              if docker exec gialgiay-api node -e "require('http').get('http://127.0.0.1:4000/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" 2>/dev/null; then
                ready=1
                echo "API healthy after ${i} checks"
                break
              fi
              echo "API not ready ($i/60)"
              docker compose -f docker-compose.prod.yml logs --tail 20 api || true
              sleep 5
            done
            docker compose -f docker-compose.prod.yml ps
            if [ "$ready" != "1" ]; then
              echo "API failed to become healthy"
              docker compose -f docker-compose.prod.yml logs --tail 120 api || true
              docker inspect gialgiay-api --format '{{json .NetworkSettings.Networks}}' || true
              exit 1
            fi
            touch "${REPO_DIR}/.db-ready"

            WORD_COUNT="$(docker exec gialgiay-api node -e 'const {PrismaClient}=require("@prisma/client"); const p=new PrismaClient(); p.word.count().then((c)=>{process.stdout.write(String(c)); process.exit(0);})')"
            echo "Dictionary words in database: ${WORD_COUNT}"
            if [ "${WORD_COUNT:-0}" -lt 1000 ]; then
              echo "Loading full dictionary"
              docker exec gialgiay-api node prisma/seed.js
              docker exec gialgiay-api node -e 'const {PrismaClient}=require("@prisma/client"); const p=new PrismaClient(); Promise.all([p.word.count(), p.phrase.count(), p.word.groupBy({by:["source"]})]).then(([w,ph,s])=>{console.log("words",w,"phrases",ph,"sources",s.map((x)=>x.source).join(",")); process.exit(0);})'
            fi

            echo "Compiled prompt in API image:"
            docker exec gialgiay-api node -e 'const fs=require("fs"); for (const f of ["dist/ai/system-prompt.js","dist/src/ai/system-prompt.js"]) { try { const t=fs.readFileSync(f,"utf8"); console.log(f, "platform", t.includes("Платформ кхеллар"), "uncertain", t.includes("<uncertain>"), "len", t.length); } catch(e) { console.log(f, "missing"); } } console.log("container DEEPSEEK_API_KEY", Boolean(process.env.DEEPSEEK_API_KEY), (process.env.DEEPSEEK_API_KEY||"").length); console.log("container SYSTEM_PROMPT len", (process.env.SYSTEM_PROMPT||"").trim().length);'
            echo "Caddy -> API health:"
            docker exec "$CADDY_ID" wget -qO- http://gialgiay-api:4000/api/health || true
            echo
            docker exec "$CADDY_ID" caddy reload --config /etc/caddy/Caddyfile || true
