<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WOAson</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Georgia, "Times New Roman", serif; background: #f4f1ea; color: #16130e;
    }
    main { max-width: 520px; padding: 32px; text-align: center; }
    .mark {
      width: 48px; height: 48px; margin: 0 auto 18px; border: 1.5px solid #16130e;
      display: grid; place-items: center; font-size: 22px;
    }
    h1 { font-size: 28px; font-weight: 600; margin: 0 0 10px; }
    p { color: #5c564c; line-height: 1.55; }
    a { color: #9a3412; }
  </style>
</head>
<body>
  <main>
    <div class="mark">W</div>
    <h1>WOAson</h1>
    <p>Витрина появится здесь. API уже работает на <a href="https://api.woason.ru/docs">api.woason.ru</a>.</p>
  </main>
</body>
</html>
