services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: woason
      POSTGRES_PASSWORD: woason
      POSTGRES_DB: woason
    ports:
      - "5432:5432"
    volumes:
      - woason_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woason -d woason"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://woason:woason@postgres:5432/woason?sslmode=disable
      MIGRATIONS_PATH: /app/migrations
      UPLOAD_DIR: /app/uploads
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    volumes:
      - woason_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  woason_pg:
  woason_uploads:
