openapi: 3.0.3
info:
  title: WOAson API
  version: 1.0.0
  termsOfService: /docs/terms
  contact:
    name: WOAson Platform
    url: https://woason.ru
  license:
    name: Proprietary. All rights reserved.
  x-logo:
    altText: WOAson
  description: |
    Программный интерфейс платформы электронной торговли **WOAson** (ВОАЗОН).

    Документ описывает контракт версии **v1**. Не является публичной офертой (ст. 437 ГК РФ).
    Обработка персональных данных — Федеральный закон № 152-ФЗ.

    ## Аутентификация
    Access JWT (HS256), срок **15 минут**. Заголовок:

    `Authorization: Bearer <accessToken>`

    Refresh-токен живёт **7 суток** и одноразовый: каждый вызов `/auth/refresh` выдаёт новую пару.

    | Роль | Регистрация | Доступ |
    | --- | --- | --- |
    | `buyer` | да | витрина, корзина, заказы, чат |
    | `seller` | да (+ магазин) | кабинет продавца |
    | `admin` | нет, только оператор | `/admin/*` |

    ## Соглашения
    - Префикс REST: `/api/v1`
    - Цены, суммы заказов и доставки в JSON — **рубли**, целое число
    - Списки: `{ "items": [], "total": 0 }`
    - Ошибки: `{ "error": "текст" }`
    - Пагинация: `limit` (по умолчанию 24, максимум 100), `offset`
    - `tradeType=dropship` во внешних витринах маскируется как `retail`

    ## Доставка
    `cdek` · `pochta` · `pickup`

    ## Категории
    Только физические товары (22 slug). Классифайд (`avto`, `nedvizhimost`, `uslugi`, `rabota`, `travel`, `transport`) отклоняется.

servers:
  - url: https://api.woason.ru
    description: Production
  - url: /
    description: Текущий инстанс (локальный запуск)

tags:
  - name: Служебные
  - name: Авторизация
  - name: Каталог
  - name: Магазины
  - name: Профиль
  - name: Загрузки
  - name: Корзина
  - name: Избранное
  - name: Заказы
  - name: Отзывы
  - name: Рилсы
  - name: Чаты
  - name: Продавец
  - name: Администрирование
  - name: Платежи
  - name: Доставка
  - name: WebSocket

x-tagGroups:
  - name: Доступ
    tags: [Служебные, Авторизация, Профиль, Загрузки, WebSocket]
  - name: Витрина
    tags: [Каталог, Магазины, Рилсы, Доставка]
  - name: Покупатель
    tags: [Корзина, Избранное, Заказы, Отзывы, Чаты]
  - name: Кабинеты
    tags: [Продавец, Администрирование, Платежи]

security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags: [Служебные]
      security: []
      summary: Проверка живости
      operationId: health
      responses:
        "200":
          description: Сервис доступен
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }

  /ws:
    get:
      tags: [WebSocket]
      summary: Канал реального времени
      description: |
        Upgrade до WebSocket. Access-токен — query `token`.

        Входящие сообщения:
        - `{ "type":"subscribe", "channel":"chat", "peerId":"<id>" }`
        - `{ "type":"chat.send", "peerId":"<id>", "text":"…" }`
        - `{ "type":"chat.typing", "peerId":"<id>" }`

        Исходящие: `chat.message`, `chat.typing`, `order.updated`, `payment.succeeded`, `error`.
      security: []
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
          description: Access JWT
      responses:
        "101": { description: Switching Protocols }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/auth/register:
    post:
      tags: [Авторизация]
      security: []
      summary: Регистрация покупателя или продавца
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/auth/login:
    post:
      tags: [Авторизация]
      security: []
      summary: Вход
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/auth/logout:
    post:
      tags: [Авторизация]
      security: []
      summary: Выход (отзыв refresh)
      operationId: logout
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200": { $ref: "#/components/responses/OK" }

  /api/v1/auth/refresh:
    post:
      tags: [Авторизация]
      security: []
      summary: Обновление пары токенов
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/me:
    get:
      tags: [Профиль]
      summary: Текущий пользователь
      operationId: me
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Профиль]
      summary: Изменить имя, телефон, аватар
      operationId: patchMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
                avatar: { type: string, description: Публичный URL после /uploads }
      responses:
        "200":
          description: Обновлённый профиль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/uploads:
    post:
      tags: [Загрузки]
      summary: Загрузка изображений
      description: |
        `multipart/form-data`: поле `kind` и файлы в `files`.
        `kind`: `product` | `avatar` | `banner` | `story` | `review`.
        Для `review` — не более 4 файлов, иначе до 12. Максимум 10 МБ. JPEG, PNG, WebP, GIF, AVIF.
      operationId: upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, files]
              properties:
                kind:
                  type: string
                  enum: [product, avatar, banner, story, review]
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "200":
          description: Публичные URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/categories:
    get:
      tags: [Каталог]
      security: []
      summary: Справочник товарных категорий
      operationId: categories
      responses:
        "200":
          description: 22 категории физических товаров
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Category" }

  /api/v1/products:
    get:
      tags: [Каталог]
      security: []
      summary: Витрина товаров
      description: Нетоварные категории возвращают пустой список. JWT необязателен.
      operationId: listProducts
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: condition
          schema: { type: string, enum: [new, used, all] }
        - in: query
          name: q
          schema: { type: string }
          description: Поиск по названию и описанию
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: sort
          schema: { type: string, enum: [new, price, price_asc, price_desc, rating] }
      responses:
        "200": { $ref: "#/components/responses/ProductList" }
        "500": { $ref: "#/components/responses/Error" }

  /api/v1/products/{id}:
    get:
      tags: [Каталог]
      security: []
      summary: Карточка товара
      operationId: getProduct
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Товар
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/products/{id}/reviews:
    get:
      tags: [Отзывы]
      security: []
      summary: Отзывы товара
      operationId: productReviews
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Limit50"
        - $ref: "#/components/parameters/Offset"
        - in: query
          name: sort
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/ReviewList" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [Отзывы]
      summary: Оставить отзыв после получения заказа
      operationId: createReview
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReviewRequest" }
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/reels:
    get:
      tags: [Рилсы]
      security: []
      summary: Лента рилсов
      operationId: listReels
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": { $ref: "#/components/responses/ReelList" }

  /api/v1/reels/{id}:
    get:
      tags: [Рилсы]
      security: []
      summary: Рилс
      operationId: getReel
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Рилс
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reel" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/reels/{id}/like:
    post:
      tags: [Рилсы]
      summary: Лайк / снять лайк
      operationId: likeReel
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Рилс с актуальным счётчиком
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reel" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/reels/{id}/comments:
    post:
      tags: [Рилсы]
      summary: Комментарий к рилсу
      operationId: commentReel
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        "201":
          description: Комментарий
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReelComment" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/shops/{id}:
    get:
      tags: [Магазины]
      security: []
      summary: Публичная витрина магазина
      operationId: getShop
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Магазин
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shop" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/shops/{id}/products:
    get:
      tags: [Магазины]
      security: []
      summary: Товары магазина
      operationId: shopProducts
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: sort
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/ProductList" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/shops/{id}/reels:
    get:
      tags: [Магазины]
      security: []
      summary: Рилсы магазина
      operationId: shopReels
      parameters:
        - $ref: "#/components/parameters/ID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": { $ref: "#/components/responses/ReelList" }

  /api/v1/shops/{id}/stories:
    get:
      tags: [Магазины]
      security: []
      summary: Сторис магазина
      operationId: shopStories
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Список сторис
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Story" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/delivery/quote:
    get:
      tags: [Доставка]
      security: []
      summary: Расчёт стоимости доставки
      description: Справочная оценка до оформления заказа.
      operationId: deliveryQuote
      parameters:
        - in: query
          name: method
          required: true
          schema: { $ref: "#/components/schemas/DeliveryMethod" }
        - in: query
          name: city
          schema: { type: string, example: Москва }
        - in: query
          name: weightKg
          schema: { type: number, format: double }
      responses:
        "200":
          description: Оценка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryQuote" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/cart:
    get:
      tags: [Корзина]
      summary: Содержимое корзины
      operationId: getCart
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [Корзина]
      summary: Добавить товар
      operationId: addCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string }
                qty: { type: integer, default: 1 }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Корзина]
      summary: Заменить корзину целиком
      operationId: putCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: "#/components/schemas/CartItemIn" }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Корзина]
      summary: Очистить корзину
      operationId: clearCart
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/cart/{productId}:
    patch:
      tags: [Корзина]
      summary: Изменить количество
      operationId: patchCartItem
      parameters:
        - $ref: "#/components/parameters/ProductID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qty]
              properties:
                qty: { type: integer, minimum: 0 }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Корзина]
      summary: Удалить позицию
      operationId: deleteCartItem
      parameters:
        - $ref: "#/components/parameters/ProductID"
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/favorites:
    get:
      tags: [Избранное]
      summary: Список избранного
      operationId: favorites
      responses:
        "200": { $ref: "#/components/responses/ProductList" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [Избранное]
      summary: Добавить в избранное
      operationId: addFavorite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string }
      responses:
        "200": { $ref: "#/components/responses/ProductList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/favorites/{productId}:
    delete:
      tags: [Избранное]
      summary: Убрать из избранного
      operationId: deleteFavorite
      parameters:
        - $ref: "#/components/parameters/ProductID"
      responses:
        "200": { $ref: "#/components/responses/ProductList" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/checkout:
    post:
      tags: [Заказы]
      summary: Оформить заказ из корзины
      description: |
        Корзина должна содержать товары одного продавца.
        Ответ 201: `order` и `confirmationUrl` (страница ЮKassa).
        При `PAYMENTS_MOCK=true` заказ сразу переходит в `awaiting_shipment`.
      operationId: checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivery]
              properties:
                address: { type: string }
                city: { type: string, example: Москва }
                delivery: { $ref: "#/components/schemas/DeliveryMethod" }
      responses:
        "201":
          description: Заказ создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/v1/orders/{id}:
    get:
      tags: [Заказы]
      summary: Заказ (покупатель, продавец или администратор)
      operationId: getOrder
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Заказ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/cabinet/dashboard:
    get:
      tags: [Заказы]
      summary: Сводка кабинета покупателя
      operationId: cabinetDashboard
      responses:
        "200":
          description: Дашборд
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerDashboard" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/cabinet/orders:
    get:
      tags: [Заказы]
      summary: Заказы покупателя
      operationId: cabinetOrders
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": { $ref: "#/components/responses/OrderList" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/cabinet/reviews:
    get:
      tags: [Отзывы]
      summary: Отзывы покупателя
      operationId: cabinetReviews
      parameters:
        - $ref: "#/components/parameters/Limit50"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200": { $ref: "#/components/responses/ReviewList" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/cabinet/reviews/pending:
    get:
      tags: [Отзывы]
      summary: Ожидают отзыва (доставленные без отзыва)
      operationId: cabinetPendingReviews
      parameters:
        - $ref: "#/components/parameters/Limit50"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Список
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      items:
                        type: array
