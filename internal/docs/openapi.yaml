        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-токен из /auth/login или /auth/refresh. Срок 15 минут.

  parameters:
    ID:
      in: path
      name: id
      required: true
      schema: { type: string }
    ProductID:
      in: path
      name: productId
      required: true
      schema: { type: string }
    PeerID:
      in: path
      name: peerId
      required: true
      schema: { type: string }
      description: Идентификатор собеседника (магазин или покупатель)
    Limit:
      in: query
      name: limit
      schema: { type: integer, default: 24, minimum: 1, maximum: 100 }
    Limit50:
      in: query
      name: limit
      schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
    Offset:
      in: query
      name: offset
      schema: { type: integer, default: 0, minimum: 0 }

  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    OK:
      description: Операция выполнена
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: string, example: "true" }
    TokenPair:
      description: Сессия
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TokenPair" }
    ProductList:
      description: Список товаров
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ListMeta"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
    ReviewList:
      description: Список отзывов
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ListMeta"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Review" }
    ReelList:
      description: Список рилсов
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ListMeta"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Reel" }
    OrderList:
      description: Список заказов
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ListMeta"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
    UserList:
      description: Список пользователей
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ListMeta"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
    Cart:
      description: Корзина
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ListMeta"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CartItem" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    ListMeta:
      type: object
      properties:
        total: { type: integer }
    Role:
      type: string
      enum: [buyer, seller, admin]
    DeliveryMethod:
      type: string
      enum: [cdek, pochta, pickup]
    OrderStatus:
      type: string
      enum:
        - placed
        - awaiting_payment
        - paid
        - awaiting_shipment
        - label_printed
        - in_transit
        - delivered
        - cancelled
        - refunded
    TradeType:
      type: string
      enum: [retail, wholesale, dropship]
    RegisterRequest:
      type: object
      required: [name, email, phone, password, role]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, example: "+79001112233" }
        password: { type: string, format: password, minLength: 4 }
        role: { type: string, enum: [buyer, seller] }
        shopName: { type: string }
        shopDescription: { type: string }
        city: { type: string }
        delivery:
          type: array
          items: { $ref: "#/components/schemas/DeliveryMethod" }
    RefreshRequest:
      type: object
      properties:
        refreshToken: { type: string }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        avatar: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        bannedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        seller: { $ref: "#/components/schemas/Shop" }
    Shop:
      type: object
      properties:
        id: { type: string }
        shopName: { type: string }
        description: { type: string }
        logo: { type: string }
        banner: { type: string }
        city: { type: string }
        phone: { type: string }
        kind: { type: string, enum: [shop, private] }
        delivery:
          type: array
          items: { $ref: "#/components/schemas/DeliveryMethod" }
        hidden: { type: boolean }
        createdAt: { type: string, format: date-time }
    Category:
      type: object
      properties:
        slug: { type: string, example: odezhda }
        name: { type: string, example: Одежда }
        icon: { type: string }
        group: { type: string, example: Мода }
    Product:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        price: { type: integer, description: Рубли }
        oldPrice: { type: integer, nullable: true }
        rating: { type: number, format: double }
        reviewsCount: { type: integer }
        reviews:
          type: array
          items: { $ref: "#/components/schemas/Review" }
        sellerKind: { type: string, enum: [shop, private] }
        condition: { type: string, enum: [new, used] }
        category: { type: string }
        image: { type: string }
        images:
          type: array
          items: { type: string }
        sellerId: { type: string }
        sellerName: { type: string }
        city: { type: string }
        weightKg: { type: number, format: double }
        inStock: { type: integer }
        delivery:
          type: array
          items: { $ref: "#/components/schemas/DeliveryMethod" }
        tags:
          type: array
          items: { type: string }
        tradeType: { $ref: "#/components/schemas/TradeType" }
        hidden: { type: boolean }
        createdAt: { type: string, format: date-time }
    CreateProductRequest:
      type: object
      required: [title, price, category, image]
      properties:
        title: { type: string }
        description: { type: string }
        price: { type: integer, minimum: 1 }
        oldPrice: { type: integer }
        condition: { type: string, enum: [new, used] }
        category: { type: string }
        image: { type: string }
        images:
          type: array
          items: { type: string }
          maxItems: 12
        city: { type: string }
        weightKg: { type: number, format: double }
        inStock: { type: integer }
        delivery:
          type: array
          items: { $ref: "#/components/schemas/DeliveryMethod" }
        tags:
          type: array
          items: { type: string }
        tradeType: { $ref: "#/components/schemas/TradeType" }
    Review:
      type: object
      properties:
        id: { type: string }
        productId: { type: string }
        orderId: { type: string }
        userId: { type: string }
        author: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string }
        date: { type: string }
        photos:
          type: array
          items: { type: string }
        productTitle: { type: string }
        productImage: { type: string }
        sellerReply: { type: string }
        sellerReplyAt: { type: string }
    CreateReviewRequest:
      type: object
      required: [orderId, rating, text]
      properties:
        orderId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string, minLength: 8, maxLength: 2000 }
        photos:
          type: array
          items: { type: string }
          maxItems: 4
    PendingReview:
      type: object
      properties:
        orderId: { type: string }
        productId: { type: string }
        title: { type: string }
        price: { type: integer }
        image: { type: string }
        deliveredAt: { type: string }
    Reel:
      type: object
      properties:
        id: { type: string }
        productId: { type: string }
        sellerId: { type: string }
        sellerName: { type: string }
        title: { type: string }
        caption: { type: string }
        likes: { type: integer }
        comments:
          type: array
          items: { $ref: "#/components/schemas/ReelComment" }
        durationSec: { type: integer }
        gradient:
          type: array
          items: { type: string }
        liked: { type: boolean }
    ReelComment:
      type: object
      properties:
        id: { type: string }
        author: { type: string }
        text: { type: string }
        createdAt: { type: string }
    Story:
      type: object
      properties:
        id: { type: string }
        sellerId: { type: string }
        image: { type: string }
        caption: { type: string }
        createdAt: { type: string }
    CartItemIn:
      type: object
      properties:
        productId: { type: string }
        qty: { type: integer }
    CartItem:
      type: object
      properties:
        productId: { type: string }
        qty: { type: integer }
        product: { $ref: "#/components/schemas/Product" }
    OrderItem:
      type: object
      properties:
        productId: { type: string }
        title: { type: string }
        price: { type: integer }
        qty: { type: integer }
        image: { type: string }
    Order:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        buyerId: { type: string }
        sellerId: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        city: { type: string }
        address: { type: string }
        delivery: { $ref: "#/components/schemas/DeliveryMethod" }
        deliveryPrice: { type: integer }
        eta: { type: string }
        trackNumber: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        total: { type: integer, description: Рубли, товары + доставка }
    CheckoutResult:
      type: object
      properties:
        order: { $ref: "#/components/schemas/Order" }
        confirmationUrl: { type: string }
        confirmationURL: { type: string }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string }
        amount: { type: integer }
        status:
          type: string
          enum: [pending, waiting_for_capture, succeeded, canceled]
        confirmationUrl: { type: string }
    YookassaWebhook:
      type: object
      properties:
        event: { type: string, example: payment.succeeded }
        object:
          type: object
          additionalProperties: true
    DeliveryQuote:
      type: object
      properties:
        price: { type: integer }
        eta: { type: string }
        days: { type: string }
    UploadResult:
      type: object
      properties:
        urls:
          type: array
          items: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              filename: { type: string }
    ChatThread:
      type: object
      properties:
        id: { type: string }
        sellerId: { type: string }
        buyerId: { type: string }
        peerId: { type: string }
        peerName: { type: string }
        lastText: { type: string }
        lastAt: { type: string, format: date-time }
        unread: { type: integer }
    ChatMessage:
      type: object
      properties:
        id: { type: string }
        threadId: { type: string }
        sellerId: { type: string }
        buyerId: { type: string }
        fromId: { type: string }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
        hidden: { type: boolean }
    BuyerDashboard:
      type: object
      properties:
        favoritesCount: { type: integer }
        cartCount: { type: integer }
        ordersCount: { type: integer }
        spent: { type: integer }
        inTransit: { type: integer }
        waitingReviews: { type: integer }
        week:
          type: array
          items:
            type: object
            properties:
              date: { type: string }
              sum: { type: integer }
    SellerDashboard:
      type: object
      properties:
        productsCount: { type: integer }
        ordersCount: { type: integer }
        newOrders: { type: integer }
        inTransit: { type: integer }
        turnover: { type: integer }
        deliveredSum: { type: integer }
        shop: { $ref: "#/components/schemas/Shop" }
    PatchShopRequest:
      type: object
      properties:
        shopName: { type: string }
        description: { type: string }
        logo: { type: string }
        banner: { type: string }
        city: { type: string }
        phone: { type: string }
        delivery:
          type: array
          items: { $ref: "#/components/schemas/DeliveryMethod" }
    AdminStats:
      type: object
      properties:
        users: { type: integer }
        sellers: { type: integer }
        buyers: { type: integer }
        admins: { type: integer }
        banned: { type: integer }
        shops: { type: integer }
        hiddenShops: { type: integer }
        products: { type: integer }
        hiddenProducts: { type: integer }
        orders: { type: integer }
        payments: { type: integer }
        gmv: { type: integer }
        chats: { type: integer }
